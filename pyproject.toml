[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snodas-tools"
dynamic = ["version"]
description = "Download, convert, and summarize NOAA SNODAS snow data for any basin in the contiguous US."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abe Hendricks" }]
requires-python = ">=3.11"
keywords = ["snodas", "snow", "swe", "hydrology", "nsidc", "noaa", "watershed", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "scipy>=1.11",
    "netcdf4>=1.6",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
excel = ["xlsxwriter>=3.1"]
plot = ["matplotlib>=3.8"]
s3 = ["boto3>=1.28"]
all = ["snodas-tools[parquet,excel,plot,s3]"]
dev = ["snodas-tools[all]", "pytest>=8"]

[project.scripts]
snodas = "snodas_tools.cli:main"

[project.urls]
Homepage = "https://github.com/wheredoesyourmindgo/snodas-tools"
"SNODAS user guide" = "https://nsidc.org/data/g02158"

[tool.hatch.version]
path = "src/snodas_tools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snodas_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
